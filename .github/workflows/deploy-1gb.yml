name: Deploy Komok to 1GB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-komok-1gb
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publish Komok
        run: dotnet publish ./Komok/Komok.csproj --configuration Release --output ./publish

      - name: Write production database settings
        env:
          KOMOK_DATABASE: ${{ secrets.KOMOK_DATABASE }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import socket
          import xml.etree.ElementTree as ET
          from pathlib import Path

          connection = os.environ.get("KOMOK_DATABASE", "")
          if not connection:
              raise SystemExit("GitHub Secret KOMOK_DATABASE is required")

          entries = dict(
              (key.strip().lower(), value.strip())
              for part in connection.split(";")
              if "=" in part
              for key, value in [part.split("=", 1)]
          )
          host = entries.get("host") or entries.get("server")
          if not host:
              raise SystemExit("KOMOK_DATABASE must contain a Host value")
          try:
              socket.getaddrinfo(host, None)
          except OSError:
              raise SystemExit("The database Host in KOMOK_DATABASE cannot be resolved")

          settings_path = Path("publish/appsettings.Production.json")
          settings_path.write_text(
              json.dumps({"ConnectionStrings": {"KomokDatabase": connection}}, indent=2) + "\n",
              encoding="utf-8",
          )

          config_path = Path("publish/web.config")
          tree = ET.parse(config_path)
          aspnet = tree.find(".//aspNetCore")
          if aspnet is None:
              raise SystemExit("publish/web.config does not contain aspNetCore configuration")

          aspnet.set("stdoutLogEnabled", "true")
          aspnet.set("stdoutLogFile", r".\logs\stdout")
          Path("publish/logs").mkdir(exist_ok=True)
          ET.indent(tree, space="  ")
          tree.write(config_path, encoding="utf-8", xml_declaration=True)
          PY
      - name: Prepare FTP deployment markers
        run: |
          mkdir -p ./offline ./empty
          printf '%s\n' '<html><body>Сайт обновляется, зайдите через минуту.</body></html>' > ./offline/app_offline.htm

      - name: Stop site before updating locked assemblies
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.ONEGB_FTP_SERVER }}
          username: ${{ secrets.ONEGB_FTP_USERNAME }}
          password: ${{ secrets.ONEGB_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./offline/
          server-dir: ./http/
          state-name: .ftp-deploy-offline-sync-state.json

      - name: Wait for IIS to release application files
        run: sleep 10
      - name: Deploy to 1GB over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.ONEGB_FTP_SERVER }}
          username: ${{ secrets.ONEGB_FTP_USERNAME }}
          password: ${{ secrets.ONEGB_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./publish/
          server-dir: ./http/
      - name: Bring site online after deployment
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.ONEGB_FTP_SERVER }}
          username: ${{ secrets.ONEGB_FTP_USERNAME }}
          password: ${{ secrets.ONEGB_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./empty/
          server-dir: ./http/
          state-name: .ftp-deploy-offline-sync-state.json